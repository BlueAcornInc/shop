services:
  app:
    env_file: .env
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: ${BASE_IMAGE:-mcr.microsoft.com/devcontainers/base:bullseye}
        USE_JFROG: ${USE_JFROG:-false}
    entrypoint: sleep infinity
    environment:
      - JFROG_TOKEN=${JFROG_TOKEN:-}
      - AEM_PARAMS=${AEM_PARAMS:---url https://main--shop-summit--blueacorninc.aem.live}
    volumes:
      - ../..:/workspaces:cached
    ports:
      - "3000:3000"
