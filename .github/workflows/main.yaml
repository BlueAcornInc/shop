name: Build
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: 20
    # Authenticate git clones to sibling private BA-org repos (the
    # @blueacorn/aem-commerce-theme-summit theme dep and any future
    # github: deps). BAC_BOT_PAT is a repo secret; default secrets.GITHUB_TOKEN
    # only scopes to this repo, not org-siblings.
    #
    # Two layers: (1) netrc provides the credential for https://github.com
    # so the PAT never appears in git config. (2) url.insteadOf rewrites every
    # ssh-ish form npm might emit (`ssh://`, `git@:`, `git+ssh://`) to plain
    # https, letting netrc handle auth. A trailing `git ls-remote` smoke-tests
    # the setup so CI fails loudly here if the PAT is missing/wrong rather
    # than with a confusing npm error three steps later.
    - name: Authorize private BA-org deps
      run: |
        AUTH="https://x-access-token:${BAC_BOT_PAT}@github.com/"
        git config --global --add url."${AUTH}".insteadOf "ssh://git@github.com/"
        git config --global --add url."${AUTH}".insteadOf "git@github.com:"
        git config --global --add url."${AUTH}".insteadOf "git+ssh://git@github.com/"
        git config --global --add url."${AUTH}".insteadOf "https://github.com/"
        echo "== PAT probe: Metadata (list repo — /repos) =="
        curl -sS -o /dev/null -w "  %{http_code}\n" -u "x-access-token:${BAC_BOT_PAT}" https://api.github.com/repos/BlueAcornInc/aem-commerce-theme-summit
        echo "== PAT probe: Contents (list root — needs Contents:Read) =="
        curl -sS -o /dev/null -w "  %{http_code}\n" -u "x-access-token:${BAC_BOT_PAT}" https://api.github.com/repos/BlueAcornInc/aem-commerce-theme-summit/contents/
        echo "== PAT probe: git-upload-pack direct (what git actually uses) =="
        curl -sS -o /dev/null -w "  %{http_code}\n" -u "x-access-token:${BAC_BOT_PAT}" "https://github.com/BlueAcornInc/aem-commerce-theme-summit.git/info/refs?service=git-upload-pack"
        echo "== git config --get-all url.rewrites =="
        git config --global --get-regexp '^url\.' | sed 's/PAT=.*/PAT=***/'
        echo "== test BA-org access via git (with CURL_VERBOSE) =="
        GIT_CURL_VERBOSE=1 git ls-remote ssh://git@github.com/BlueAcornInc/aem-commerce-theme-summit.git HEAD 2>&1 | grep -iE "(> GET|> Authorization|< HTTP|< www-authenticate|fatal)" | head -10
      env:
        BAC_BOT_PAT: ${{ secrets.BAC_BOT_PAT }}
    # `npm install` (not `npm ci`) because package-lock.json is gitignored —
    # BAC devs install through JFrog's bac-npm-remote, which resolves to
    # different URLs/shasums than public npm. Committing a JFrog-flavored
    # lockfile would break this step (wrong registry) and committing a
    # public-npm lockfile requires a non-BAC machine to generate. Since the
    # CI step is lint-only and EDS doesn't deploy anything from here,
    # dropping `ci` semantics is the cheapest fix.
    - run: npm install --no-audit --no-fund
    - run: npm run lint
