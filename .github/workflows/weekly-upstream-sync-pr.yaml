name: Weekly Upstream Sync PR

on:
  schedule:
    - cron: "0 13 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  upstream-sync-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.BAC_BOT_PAT }}

      - name: Configure git identity
        run: |
          git config user.name "bac-bot"
          git config user.email "bot@blueacorn.com"

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/hlxsites/aem-boilerplate-commerce.git 2>/dev/null || true
          git fetch upstream main

      - name: Create/update sync branch from upstream
        id: sync_branch
        run: |
          BRANCH="automation/upstream-sync-$(date +%Y%m%d)"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

          git checkout -B "$BRANCH" upstream/main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com
          scope: "@blueacorninc"

      - name: Install dependencies
        env:
          NODE_AUTH_TOKEN: ${{ secrets.BAC_BOT_PAT }}
        run: npm install --no-audit --no-fund

      - name: Run lint
        run: npm run lint

      - name: Push sync branch
        run: git push --force-with-lease origin "${{ steps.sync_branch.outputs.branch }}"

      - name: Create or update PR
        id: pr
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.BAC_BOT_PAT }}
          branch: ${{ steps.sync_branch.outputs.branch }}
          base: main
          title: "chore(upstream): weekly sync from aem-boilerplate-commerce"
          body: |
            Automated weekly upstream sync.

            Source: `hlxsites/aem-boilerplate-commerce:main`
            Generated by: `.github/workflows/weekly-upstream-sync-pr.yaml`

            Validation performed in workflow:
            - `npm install --no-audit --no-fund`
            - `npm run lint`
          labels: |
            automation
            upstream-sync

      - name: Auto-approve PR (optional)
        if: ${{ steps.pr.outputs.pull-request-number != '' && secrets.BAC_BOT_PAT != '' }}
        env:
          GH_TOKEN: ${{ secrets.BAC_BOT_PAT }}
        run: gh pr review ${{ steps.pr.outputs.pull-request-number }} --approve --body "Auto-approved: upstream sync workflow checks passed."
